<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="mensaje">Seleccione un idioma</p>
    <button type="button" onclick="bienvenida('ruso')">Ruso</button>
    <button type="button" onclick="bienvenida('español')">Español</button>
    <button type="button" onclick="bienvenida('inglés')">Inglés</button>

    <script>
        function bienvenida(idioma) {
            const mensaje = document.getElementById("mensaje");
            switch (idioma) {
                case 'ruso':
                    mensaje.textContent = "Привет, мир!";
                    mensaje.style.color = "blue";
                    break;
                case 'español':
                    mensaje.textContent = "¡Hola, mundo!";
                    mensaje.style.color = "green";
                    break;
                case 'inglés':
                    mensaje.textContent = "Hello, world!";
                    mensaje.style.color = "red";
                    break;
            }
        }
    </script>
</body>
</html>
