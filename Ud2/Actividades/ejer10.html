<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 10</title>
</head>

<body>
    <h2>Actividad 10</h2>
    <p>Se pide realizar un script utilizando bucles que
        muestre en una página web el rombo</p>

    <br><br>

    <label>Número de filas</label><br>
    <input type="text" id="filas" oninput="rombo()">

    <p id="salida"></p>
</body>

<script>
    //funcion para crear el rombo
    function rombo(){
        //según el numero de filas que se introduzcan 
        filas = document.getElementById("filas").value;
        
                
        //un rombo son dos triangulos juntos

        //Creciente
        for (i = 0; i < filas; i++){
            espaciohtml = "";
            asterisco = "";

            for (k = 0; k < filas - i -1 ; k++){
                espaciohtml += "&nbsp&nbsp";
            }

            for(j = 1;  j <= 2*i +1; j++){
                asterisco +="*"
            }
            salida.innerHTML = salida.innerHTML + espaciohtml + asterisco + "<br>";
        }

        //Decreciente
        for (var i = filas -2; i>=0; i--){
            asterisco = "";
            espaciohtml= "";

            for( k = 0; k < filas - i -1; k++){
                espaciohtml += "&nbsp&nbsp";
            }
            for (j = 1; j <= 2 * i + 1; j++){
                asterisco += "*";
            }

            salida.innerHTML = salida.innerHTML + espaciohtml + asterisco + ">"
        }
    }
</script>
</html>
