<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 10</title>
</head>

<body>
    <h2>Actividad 10</h2>
    <p>Se pide realizar un script utilizando bucles que
        muestre en una página web el rombo</p>

    <br><br>

    <label>Número de filas</label><br>
    <input type="text" id="filas" oninput="rombo()">

    <!-- fuente monospace para que todos los caracteres ocupen lo mismo -->
    <p id="salida" ></p>
</body>

<script>
    //funcion para crear el rombo hueco
    function rombo(){
        //según el numero de filas que se introduzcan, lo pasamos a numero
        var filas = Number(document.getElementById("filas").value);
        var texto = "";

        //un rombo son dos triangulos juntos, asi que recorremos desde -(filas-1) hasta filas-1
        for (var i = -(filas - 1); i <= filas - 1; i++){

            //d es lo que se separan los asteriscos del centro: 0 en las puntas y filas-1 en el medio
            var d = filas - 1 - Math.abs(i);

            //recorremos las columnas de la fila
            for (var c = 0; c <= filas - 1 + d; c++){

                //solo ponemos asterisco en los dos bordes, el resto son espacios
                if (c == filas - 1 - d || c == filas - 1 + d){
                    texto += "*&nbsp;";
                } else {
                    texto += "&nbsp;&nbsp;";
                }
            }

            //salto de linea al terminar la fila
            texto += "<br>";
        }

        //mostramos el resultado una sola vez
        document.getElementById("salida").innerHTML = texto;
    }
</script>
</html>
