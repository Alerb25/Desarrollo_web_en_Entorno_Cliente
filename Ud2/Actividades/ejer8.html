<!DOCTYPE html>
<html lang="en">

<body>
    <h1> Fechas exactas </h1>
    <p>Mire la consola</p>
</body>

<script>
    //Realiza un script que extraiga el mes y el año de una fecha concreta.
    const fecha = new Date("2026, 9, 7");//fecha 7 de octubre

    console.log("El mes es "+ fecha.getMonth + " y el año es "  + fecha.getFullYear);

    //calcular las horas de cliente (6h/semana) que quedan hasta primera evaluacion (2/12/2026)
    const fechaEvaluacion = new Date("2026, 11, 2");
    const ahora = new Date();
    const diferencia = fechaEvaluacion - ahora;
    const horasRestantes = Math.floor(diferencia / (1000 * 60 * 60));
    console.log("Horas restantes hasta la primera evaluación: " + horasRestantes);
</script>
</html>
